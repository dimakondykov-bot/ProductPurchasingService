# Комментарии пишу для себя, чтоб запомнить
name: FastAPI CI/CD

on: [ push, pull_request ]

jobs:
  lint: # проверка кода линтером
    runs-on: ubuntu-latest
    steps:
      - name: Check out code # получение кода из репозитория
        uses: actions/checkout@v3

      - name: Set up Python # установка пайтон нужной версии
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install flake8 # установка flake8 для проверки кода
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run flake8 # запуск проверки кода через flake8
        # Исключаем alembic (там автогенерация) и папки окружения
        run: flake8 . --exclude=.venv,venv,.git,__pycache__,alembic/versions --max-line-length=120

  test:
    needs: lint # Запуск тестов только после успешного прохождения линтеров
    runs-on: ubuntu-latest

    # Поднимаем сервисы для тестов прямо внутри GitHub Actions
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pps
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Переменные окружения в точности как в вашем connection.py!
    env:
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_HOST: "127.0.0.1" # Локальный хост внутри окружения GitHub Actions
      DB_PORT: "5432"
      DB_DATABASE: "pps"
      SECRET_KEY: "temporary_secret_key_for_github_actions_testing"
      TELEGRAM_TOKEN_TG: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"

    steps:
      - name: Check out code # получение кода из репозитория
        uses: actions/checkout@v3

      - name: Set up python # установка пайтон нужной версии
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip # кэширование зависимостей для ускорения
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip_

      - name: Install dependencies # устанавливаем зависимости проекта
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest # запускаем тесты через pytest
        run: pytest

  build: # сборка докер образа
    needs: test # будет запускаться только после прохождения всех тестов
    runs-on: ubuntu-latest

    steps:
      - name: Check out code # получение кода из репозитория
        uses: actions/checkout@v3

      - name: Log in in Docker hub # авторизуемся в dockerhub используя секреты
        run: echo ${{ secrets.DOCKER_HUB_ACCEES_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: build docker image # собираем docker образ на основе последнего коммита
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image in Docker hub # отправляем собранный образ в docker hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

  deploy:
    needs: build # деплоим только после успешной сборки докер образа
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH # настраиваем SSH для подключения к серверу
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server # подключаемся к серверу и деплоим через докер
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF' 
          set -e # команда заставляет немедленно завершить работу, если будет ошибка
          
          cd ${{ secrets.DEPLOY_DIR }}
          
          git pull origin ${{ github.ref_name }}
          
          echo ${{ secrets.DOCKER_HUB_ACCEES_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
          
          # 1. Скачиваем новый образ приложения
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} 
          
          # 2. Передаем переменные внутрь docker-compose при перезапуске
          export TAG=${{ github.sha }}
          export DOCKER_USER=${{ secrets.DOCKER_HUB_USERNAME }}
          
          docker-compose down
          
          # Перезапускаем контейнеры
          docker-compose up -d
          
          # 3. Автоматически запускаем миграции Alembic внутри контейнера 'web'
          docker-compose exec -T web alembic upgrade head
          
          docker-compose ps
          docker image prune -f
          EOF
